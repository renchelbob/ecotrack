name: ecotrack-mvp

x-database-environment: &database-environment
  DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://ecotrack:ecotrack_dev_password_2026@db:5432/ecotrack}

services:
  db:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    cpuset: "${ECOTRACK_POSTGRES_CPUSET:-}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecotrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotrack_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ecotrack}
      TZ: Europe/Moscow
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=384MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=250"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ecotrack_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecotrack} -d ${POSTGRES_DB:-ecotrack}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ecotrack_internal

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrations
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment: *database-environment
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ecotrack_internal

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: ecotrack-api:latest
    restart: unless-stopped
    cpuset: "${ECOTRACK_API_CPUSET:-}"
    env_file:
      - path: .env
        required: false
    environment: *database-environment
    ports:
      - "${API_BIND_HOST:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./contracts/error_catalog.json:/app/contracts/error_catalog.json:ro
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)",
        ]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ecotrack_internal

  etl:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: etl
    profiles:
      - etl
    env_file:
      - path: .env
        required: false
    environment: *database-environment
    volumes:
      - ./data/osm:/data/osm
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    networks:
      - ecotrack_internal

volumes:
  ecotrack_pgdata:
    name: ${ECOTRACK_PGDATA_VOLUME:-ecotrack_pgdata}

networks:
  ecotrack_internal:
    driver: bridge
