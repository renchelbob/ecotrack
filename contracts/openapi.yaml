          items:
            $ref: '#/components/schemas/WastePointReportItem'
        updated_at:
          type: string
          format: date-time

    SubmitWastePointReportRequest:
      type: object
      required: [report_type, user_lat, user_lon]
      properties:
        report_type:
          $ref: '#/components/schemas/ReportType'
        comment:
          type: [string, 'null']
          maxLength: 500
        user_lat:
          type: number
          format: double
          minimum: -90.0
          maximum: 90.0
        user_lon:
          type: number
          format: double
          minimum: -180.0
          maximum: 180.0

    WastePointReportCreatedResponse:
      type: object
      required: [report, updated_trust_score, updated_status, points_rewarded]
      properties:
        report:
          $ref: '#/components/schemas/WastePointReportItem'
        updated_trust_score:
          type: number
          format: double
        updated_status:
          $ref: '#/components/schemas/WastePointStatus'
        points_rewarded:
          type: integer
          minimum: 0

    SuggestWastePointRequest:
      type: object
      required: [title, accepted_fractions, lat, lon]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        address_text:
          type: [string, 'null']
          maxLength: 255
        operator_name:
          type: [string, 'null']
          maxLength: 120
        opening_hours:
          type: [string, 'null']
          maxLength: 160
        accepted_fractions:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/WasteFractionCode'
        lat:
          type: number
          format: double
          minimum: -90.0
          maximum: 90.0
        lon:
          type: number
          format: double
          minimum: -180.0
          maximum: 180.0
        comment:
          type: [string, 'null']
          maxLength: 500

    # -------------------------------------------------------------------------
    # PUSH NOTIFICATIONS SCHEMAS
    # -------------------------------------------------------------------------
    RegisterPushTokenRequest:
      type: object
      required: [platform, token, device_id]
      properties:
        platform:
          $ref: '#/components/schemas/PushPlatformType'
        token:
          type: string
          minLength: 8
          maxLength: 512
        device_id:
          type: string
          minLength: 4
          maxLength: 128

    PushTokenResponse:
      type: object
      required: [id, platform, device_id, is_enabled, updated_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          $ref: '#/components/schemas/PushPlatformType'
        device_id:
          type: string
        is_enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
