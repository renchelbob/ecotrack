name: ecotrack_mobile
description: "EcoTrack mobile application - Contract-First Flutter client with offline SQLite WAL engine."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  dio: ^5.8.0+1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_foreground_task: ^9.0.0
  flutter_local_notifications: ^19.0.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.2.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^14.0.0
  go_router: ^14.8.1
  health: ^12.1.0
  intl: ^0.20.2
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pedometer: ^4.1.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.2
  sqflite: ^2.4.2

dev_dependencies:
  dart_code_linter: ^4.4.1
  flutter_test:
    sdk: flutter
  glados: ^1.1.7
  lint: ^2.3.0
  sqflite_common_ffi: ^2.3.5

flutter:
  uses-material-design: true

  assets:
    - assets/db/client_sqlite_schema.sql
    - assets/errors/error_catalog.json
    - assets/vectors/
