[project]
name = "ecotrack-api"
version = "1.0.0"
description = "EcoTrack Backend - Contract-First FastAPI, asyncpg & PostGIS API for 152-FZ Compliance"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.150.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.0",
    "icontract>=2.7.1",
]

[dependency-groups]
dev = [
    { include-group = "migrations" },
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.124.0",
    "schemathesis>=3.39.0",
    "crosshair-tool>=0.0.76",
    "ruff>=0.9.0",
    "basedpyright>=1.23.0",
    "pyyaml>=6.0.2",
    "asyncpg-stubs>=0.32,<0.33",
]
migrations = [
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "S", "SIM", "UP", "RUF", "FA", "TID", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pydantic.v1".msg = "pydantic.v1 is strictly forbidden; use native Pydantic v2.14 APIs."
"unittest.mock".msg = "Classic mock-heavy TDD is forbidden; use real PostGIS fixtures and Hypothesis."
"shapely".msg = "C-GIS libraries are forbidden in backend; execute spatial ops in PostGIS SQL."
"geopandas".msg = "C-GIS libraries are forbidden in backend; execute spatial ops in PostGIS SQL."
"osgeo".msg = "GDAL/osgeo is forbidden in backend; execute spatial ops in PostGIS SQL."

[tool.basedpyright]
include = ["app"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnusedCoroutine = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
